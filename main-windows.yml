---
- name: Test Windows Connectivity and Setup Chromium
  hosts: localhost
  gather_facts: false

  vars:
    ansible_host: 192.168.31.165
    ansible_user: ansibleadmin
    ansible_password: Password@123
    ansible_connection: winrm
    ansible_port: 5985
    ansible_winrm_transport: basic
    ansible_winrm_server_cert_validation: ignore

    venv_path: C:\Temp\python_env
    chromium_dir: C:\Temp\chromium
    chromium_zip: C:\Temp\chromium.zip

  tasks:

    - name: Test WinRM connectivity
      win_ping:
      delegate_to: "{{ ansible_host }}"

    - name: Get hostname
      win_shell: hostname
      register: hostname_result
      delegate_to: "{{ ansible_host }}"

    - name: Display hostname
      debug:
        msg: "Connected successfully to {{ hostname_result.stdout }}"

    - name: Create temp directory
      win_file:
        path: C:\Temp
        state: directory
      delegate_to: "{{ ansible_host }}"

    - name: Create Chromium directory
      win_file:
        path: "{{ chromium_dir }}"
        state: directory
      delegate_to: "{{ ansible_host }}"

    - name: Download Chromium
      win_get_url:
        url: https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/1000027/chrome-win.zip
        dest: "{{ chromium_zip }}"
      delegate_to: "{{ ansible_host }}"

    - name: Extract Chromium
      community.windows.win_unzip:
        src: "{{ chromium_zip }}"
        dest: "{{ chromium_dir }}"
      delegate_to: "{{ ansible_host }}"

    - name: Verify Chromium exists
      win_stat:
        path: "{{ chromium_dir }}\\chrome-win\\chrome.exe"
      register: chrome_stat
      delegate_to: "{{ ansible_host }}"

    - name: Fail if Chromium missing
      fail:
        msg: "Chromium extraction failed"
      when: not chrome_stat.stat.exists

    - name: Check Chromium version
      win_shell: |
        "{{ chromium_dir }}\chrome-win\chrome.exe" --version
      register: chrome_version
      delegate_to: "{{ ansible_host }}"

    - name: Display Chromium version
      debug:
        var: chrome_version.stdout
---
- name: Aruba CX - Device Health and Inventory Check
  hosts: all
  gather_facts: false

  vars:

    # =====================================================
    # CONNECTION VARIABLES
    # =====================================================

    ansible_host: 192.168.56.20
    ansible_user: admin
    ansible_password: password

    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: arubanetworks.aoscx.aoscx

    ansible_command_timeout: 60
    ansible_connect_timeout: 30

  tasks:

    # =====================================================
    # 1. DEVICE INFORMATION
    # =====================================================

    - name: Get device version and model
      ansible.netcommon.cli_command:
        command: show version
      register: version_output

    - name: Get hostname
      ansible.netcommon.cli_command:
        command: show hostname
      register: hostname_output

    - name: Get system information
      ansible.netcommon.cli_command:
        command: show system
      register: system_output

    # =====================================================
    # 2. UPTIME
    # =====================================================

    - name: Get system uptime
      ansible.netcommon.cli_command:
        command: show system | include uptime
      register: uptime_output

    # =====================================================
    # 3. CPU AND MEMORY
    # =====================================================

    - name: Get CPU and memory utilization
      ansible.netcommon.cli_command:
        command: show system resource-utilization
      register: resource_output

    # =====================================================
    # 4. STORAGE / FLASH
    # =====================================================

    - name: Get storage information
      ansible.netcommon.cli_command:
        command: show storage
      register: storage_output
      failed_when: false

    - name: Get filesystem information
      ansible.netcommon.cli_command:
        command: show filesystem
      register: filesystem_output
      failed_when: false

    # =====================================================
    # 5. MANAGEMENT INTERFACE
    # =====================================================

    - name: Get management interface status
      ansible.netcommon.cli_command:
        command: show interface mgmt
      register: management_output

    # =====================================================
    # 6. ALL INTERFACE STATUS
    # =====================================================

    - name: Get interface summary
      ansible.netcommon.cli_command:
        command: show interface brief
      register: interface_output

    # =====================================================
    # 7. VLAN INFORMATION
    # =====================================================

    - name: Get VLAN information
      ansible.netcommon.cli_command:
        command: show vlan
      register: vlan_output

    # =====================================================
    # 8. LLDP NEIGHBORS
    # =====================================================

    - name: Get LLDP neighbor information
      ansible.netcommon.cli_command:
        command: show lldp neighbor-info
      register: lldp_output
      failed_when: false

    # =====================================================
    # 9. ENVIRONMENT HEALTH
    # =====================================================

    - name: Check temperature
      ansible.netcommon.cli_command:
        command: show environment temperature
      register: temperature_output
      failed_when: false

    - name: Check power supply
      ansible.netcommon.cli_command:
        command: show environment power-supply
      register: power_output
      failed_when: false

    - name: Check fans
      ansible.netcommon.cli_command:
        command: show environment fan
      register: fan_output
      failed_when: false

    # =====================================================
    # 10. VSX STATUS
    # =====================================================

    - name: Check VSX status
      ansible.netcommon.cli_command:
        command: show vsx status
      register: vsx_output
      failed_when: false

    # =====================================================
    # 11. RECENT EVENTS
    # =====================================================

    - name: Get recent system events
      ansible.netcommon.cli_command:
        command: show events -n 20
      register: events_output
      failed_when: false

    # =====================================================
    # 12. DISPLAY DEVICE SUMMARY
    # =====================================================

    - name: Display device information
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "ARUBA CX DEVICE INFORMATION"
          - "=================================================="
          - "{{ hostname_output.stdout }}"
          - "{{ version_output.stdout }}"
          - "=================================================="

    # =====================================================
    # 13. DISPLAY UPTIME
    # =====================================================

    - name: Display uptime
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "SYSTEM UPTIME"
          - "=================================================="
          - "{{ uptime_output.stdout }}"

    # =====================================================
    # 14. DISPLAY CPU AND MEMORY
    # =====================================================

    - name: Display CPU and memory information
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "CPU AND MEMORY UTILIZATION"
          - "=================================================="
          - "{{ resource_output.stdout }}"

    # =====================================================
    # 15. DISPLAY STORAGE
    # =====================================================

    - name: Display storage information
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "FLASH / STORAGE INFORMATION"
          - "=================================================="
          - "{{ storage_output.stdout | default('Storage information unavailable') }}"
          - "{{ filesystem_output.stdout | default('Filesystem information unavailable') }}"

    # =====================================================
    # 16. DISPLAY MANAGEMENT INTERFACE
    # =====================================================

    - name: Display management interface
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "MANAGEMENT INTERFACE"
          - "=================================================="
          - "{{ management_output.stdout }}"

    # =====================================================
    # 17. DISPLAY INTERFACE STATUS
    # =====================================================

    - name: Display interface status
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "INTERFACE STATUS"
          - "=================================================="
          - "{{ interface_output.stdout }}"

    # =====================================================
    # 18. DISPLAY VLAN INFORMATION
    # =====================================================

    - name: Display VLAN information
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "VLAN INFORMATION"
          - "=================================================="
          - "{{ vlan_output.stdout }}"

    # =====================================================
    # 19. DISPLAY LLDP INFORMATION
    # =====================================================

    - name: Display LLDP neighbors
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "LLDP NEIGHBORS"
          - "=================================================="
          - "{{ lldp_output.stdout | default('No LLDP information available') }}"

    # =====================================================
    # 20. DISPLAY ENVIRONMENT STATUS
    # =====================================================

    - name: Display hardware environment status
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "TEMPERATURE"
          - "=================================================="
          - "{{ temperature_output.stdout | default('Temperature information unavailable') }}"

          - "=================================================="
          - "POWER SUPPLY"
          - "=================================================="
          - "{{ power_output.stdout | default('Power supply information unavailable') }}"

          - "=================================================="
          - "FAN STATUS"
          - "=================================================="
          - "{{ fan_output.stdout | default('Fan information unavailable') }}"

    # =====================================================
    # 21. DISPLAY VSX STATUS
    # =====================================================

    - name: Display VSX status
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "VSX STATUS"
          - "=================================================="
          - "{{ vsx_output.stdout | default('VSX is not configured') }}"

    # =====================================================
    # 22. DISPLAY RECENT EVENTS
    # =====================================================

    - name: Display recent events
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "RECENT SYSTEM EVENTS"
          - "=================================================="
          - "{{ events_output.stdout | default('No event information available') }}"

    # =====================================================
    # 23. FINAL RESULT
    # =====================================================

    - name: Display final health check status
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "ARUBA CX HEALTH CHECK COMPLETED SUCCESSFULLY"
          - "=================================================="
          - "Device IP: {{ ansible_host }}"
          - "Connectivity: SUCCESS"
          - "System Information: COLLECTED"
          - "Uptime: CHECKED"
          - "CPU: CHECKED"
          - "Memory: CHECKED"
          - "Storage/Flash: CHECKED"
          - "Management Interface: CHECKED"
          - "Interfaces: CHECKED"
          - "VLANs: CHECKED"
          - "LLDP: CHECKED"
          - "Temperature: CHECKED"
          - "Power Supply: CHECKED"
          - "Fans: CHECKED"
          - "VSX: CHECKED"
          - "System Events: CHECKED"
          - "=================================================="
